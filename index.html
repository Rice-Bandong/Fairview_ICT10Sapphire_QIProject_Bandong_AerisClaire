<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SKU Generator</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #1a237e; color: #333; margin: 0; padding: 0; }
    nav { background-color: #0f172a; padding: 15px; text-align: right; }
    nav a { color: #fff; text-decoration: none; margin-left: 20px; font-weight: bold; }
    .container { max-width: 450px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; }
    h2 { text-align: center; color: #1a237e; margin-top: 0; }
    label { font-weight: bold; display: block; margin-top: 15px; }
    input, select, button { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
    button { background-color: #6366f1; color: white; border: none; font-weight: bold; margin-top: 20px; cursor: pointer; }
    button:hover { background-color: #4f46e5; }
    .result-box { margin-top: 20px; padding: 15px; background: #f3f4f6; text-align: center; font-weight: bold; border-radius: 6px; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">SKU Generator</a>
    <a href="receipt.html">Receipt Generator</a>
  </nav>

  <div class="container">
    <h2>SKU Generator</h2>
    
    <label for="category">Category</label>
    <select id="category">
      <option value="PER">Perishables</option>
      <option value="NON">Non-Perishables</option>
      <option value="BEV">Beverages</option>
    </select>

    <label for="productName">Product Name</label>
    <input type="text" id="productName" placeholder="e.g. Bottled Water">

    <label for="stockQty">Stock Quantity</label>
    <input type="number" id="stockQty" placeholder="e.g. 50">

    <button onclick="generateSKU()">Generate SKU</button>

    <div class="result-box" id="skuDisplay">
      Your generated SKU will appear here.
    </div>
  </div>

  <script>
    function generateSKU() {
      const category = document.getElementById('category').value;
      const productName = document.getElementById('productName').value.trim();
      const stockQty = document.getElementById('stockQty').value;

      if (!productName || !stockQty) {
        alert("Please fill in all fields.");
        return;
      }

      const nameCode = productName.substring(0, 3).toUpperCase();

      const sku = `${category}-${nameCode}-${stockQty}`;

      document.getElementById('skuDisplay').innerText = `Generated SKU: ${sku}`;
    }
  </script>

</body>
</html>
